services:
  - type: web
    name: one-travel-club-onboarding-api
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head && python -m app.db.create_initial_admin
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: uploaded-files
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: one-travel-club-onboarding-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://one-travel-club-onboarding.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@onetravelclub.co.uk
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: one-travel-club-onboarding
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_BASE_URL
        value: https://one-travel-club-onboarding-api.onrender.com

databases:
  - name: one-travel-club-onboarding-db
    databaseName: onboarding_hub
    user: onboarding_hub_user
    region: frankfurt
    plan: basic-256mb
