services:
  - type: web
    name: one-travel-club-onboarding-api
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head && python -m app.db.create_initial_admin && python -m app.db.create_default_live_sessions
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: uploaded-files
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: one-travel-club-onboarding-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://one-travel-club-onboarding.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@onetravelclub.co.uk
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_AGENT_SETUP_PRICE_ID
        sync: false
      - key: STRIPE_AGENT_MONTHLY_PRICE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: ACCOUNTS_EMAIL
        value: accounts@onetravelclub.co.uk
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_API_BASE_URL
        value: https://api.render.com/v1
      - key: RENDER_SERVICE_NAME_FILTER
        value: one-travel-club-onboarding
      - key: RENDER_METRICS_WINDOW_MINUTES
        value: "60"

  - type: web
    name: one-travel-club-onboarding
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_BASE_URL
        value: https://one-travel-club-onboarding-api.onrender.com

  - type: cron
    name: one-travel-club-onboarding-stripe-nightly-sync
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.jobs.sync_stripe_cache
    schedule: "15 2 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: one-travel-club-onboarding-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://one-travel-club-onboarding.onrender.com
      - key: STRIPE_SECRET_KEY
        fromService:
          type: web
          name: one-travel-club-onboarding-api
          envVarKey: STRIPE_SECRET_KEY
      - key: STRIPE_NIGHTLY_SYNC_LIMIT
        value: "500"

databases:
  - name: one-travel-club-onboarding-db
    databaseName: onboarding_hub
    user: onboarding_hub_user
    region: frankfurt
    plan: basic-256mb
